services:
  mongo:
    image: mongo:7
    container_name: payo-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - payo-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate().ok }"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  payo-mongo-data:
